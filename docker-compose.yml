services:
  postgres:
    image: postgres:17
    container_name: book-watcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-book_watcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-book_watcher}
      POSTGRES_DB: ${POSTGRES_DB:-book_watcher}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5499}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the volume is first created; `npm run db:reset` re-runs it.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-book_watcher} -d ${POSTGRES_DB:-book_watcher}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
